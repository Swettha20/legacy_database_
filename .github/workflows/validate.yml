name: Validate moderniser
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run disposable local Oracle/PostgreSQL integration tests
        type: boolean
        default: false
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t moderniser-ci .
      - run: docker run --rm -e ORACLE_PASSWORD=test -e PG_PASSWORD=test -v "$PWD:/app:ro" moderniser-ci python -m unittest discover -s tests -v
      - run: docker run --rm -v "$PWD:/app:ro" moderniser-ci python -c "import ast; from pathlib import Path; [ast.parse(p.read_text()) for p in Path('moderniser').glob('*.py')]"
      - run: node scripts/check-frontend.mjs
  local-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sh start_all.sh --no-browser --skip-ai
      - run: docker compose --env-file .env.stack --profile tools run --rm --no-deps bootstrap python scripts/integration_checks.py --internal
      - if: always()
        run: sh stop_all.sh
